# /etc/slurm/slurm.conf snippet
# ==============================================================================
# Slurm Multi-Device Partition Hierarchy & QoS Definitions
# ==============================================================================
GresTypes=gpu,nvme,ib
AccountingStorageEnforce=qos,limits,associations

PartitionName=tier1_dev Nodes=node[041-120] Default=YES MaxTime=12:00:00 \
    DefaultTime=02:00:00 DefMemPerCPU=8192 MaxMemPerCPU=16384 \
    AllowQOS=tier1_qos State=UP

PartitionName=tier2_inter Nodes=node[021-080] MaxTime=48:00:00 \
    DefaultTime=06:00:00 DefMemPerCPU=16384 MaxMemPerCPU=32768 \
    AllowQOS=tier2_qos State=UP

PartitionName=tier3_heavy Nodes=node[001-020] MaxTime=72:00:00 \
    DefaultTime=12:00:00 DefMemPerCPU=32768 MaxMemPerCPU=65536 \
    AllowQOS=tier3_qos PriorityTier=100 State=UP
