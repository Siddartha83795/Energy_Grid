# /etc/slurm/gres.conf
# ==============================================================================
# Heterogeneous Hardware GRES Mapping for 120 Nodes Fleet
# Supports: Full GPUs, MIG slices, MPS/Time-Slices, NVMe arrays, and InfiniBand
# ==============================================================================

# 1. Full Physical GPUs (Tier 3 Distributed Training)
NodeName=node[001-040] Name=gpu Type=a100_80gb File=/dev/nvidia[0-3]

# 2. Hardware MIG Slices (1g.10gb) (Tier 1 & Tier 2 Workloads)
NodeName=node[041-080] Name=gpu Type=mig_1g_10gb File=/dev/nvidia-caps/nvidia-cap[1-28]

# 3. Workstation GPUs with Software MPS/Time-Slicing
NodeName=node[081-120] Name=gpu Type=rtx4090 Count=8 File=/dev/nvidia[0-1]

# 4. Non-GPU Hardware: High-Speed Direct NVMe Local Block Devices
NodeName=node[001-120] Name=nvme File=/dev/nvme0n1
NodeName=node[001-120] Name=nvme File=/dev/nvme1n1

# 5. Non-GPU Hardware: InfiniBand / RoCE HCAs (Direct RDMA)
NodeName=node[001-060] Name=ib File=/dev/infiniband/uverbs0
