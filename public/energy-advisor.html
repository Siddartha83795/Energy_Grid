<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENERGY ADVISOR — Context-Aware Energy Monitoring & Excess Detection</title>
  <meta name="description" content="B.Tech Computer Science research project: Context-Aware Energy Monitoring, Excess Energy Detection & Energy-Saving Analysis." />
  <link rel="icon" type="image/png" href="./favicon.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070b14;
      color: #f8fafc;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(13, 19, 31, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }
    .glass-card-prominent {
      background: linear-gradient(135deg, rgba(26, 19, 9, 0.8) 0%, rgba(13, 19, 31, 0.9) 100%);
      border: 2px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.2);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-cyan { background: rgba(6, 182, 212, 0.12); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.12); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-red { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-primary {
      background: #06b6d4; color: #070b14; font-weight: 700; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      padding: 0.5rem 1rem; border-radius: 0.625rem; border: none; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 0.375rem;
    }
    .btn-primary:hover { background: #22d3ee; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05); color: #f8fafc; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      padding: 0.5rem 1rem; border-radius: 0.625rem; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 0.375rem;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-emerald {
      background: #10b981; color: #070b14; font-weight: 700; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      padding: 0.5rem 1rem; border-radius: 0.625rem; border: none; cursor: pointer;
    }
  </style>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen">
  <div id="root">
    <div class="flex min-h-screen items-center justify-center font-mono text-cyan-400 text-sm">
      <span>Loading Energy Advisor Research Dashboard...</span>
    </div>
  </div>

  <script src="../frontend/js/data.js"></script>
  <script type="text/babel" src="../frontend/js/app.jsx"></script>
</body>
</html>
